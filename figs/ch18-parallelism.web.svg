ranslate(282.76953125, 44.5)"><rect class="basic label-container" style="" x="-118.65625" y="-36.5" width="237.3125" height="73"/><g class="label" style="" transform="translate(-90.65625, -22.5)"><rect/><foreignObject width="181.3125" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p>Two ways to spread work<br />across devices</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DP-1" data-look="classic" transform="translate(131.3046875, 200)"><rect class="basic label-container" style="" x="-116.328125" y="-59" width="232.65625" height="118"/><g class="label" style="" transform="translate(-88.328125, -45)"><rect/><foreignObject width="176.65625" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Data parallelism</b><br /><small>one model replicated on<br />every device; each processes<br />a different sub-batch</small></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-MP-2" data-look="classic" transform="translate(434.234375, 200)"><rect class="basic label-container" style="" x="-113.890625" y="-59" width="227.78125" height="118"/><g class="label" style="" transform="translate(-85.890625, -45)"><rect/><foreignObject width="171.78125" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Model parallelism</b><br /><small>different parts of one model<br />on different devices, working<br />on the same batch</small></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DR-3" data-look="classic" transform="translate(131.3046875, 355.5)"><rect class="basic label-container" sty