<svg class="dfig" viewBox="0 0 1140 520" preserveAspectRatio="xMidYMid meet" role="img" data-sim="9" data-sim-label="hop" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arw-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5FC9DE"/></marker></defs><style></style><text x="66.0" y="106.0" text-anchor="start" dominant-baseline="middle" fill="#22D3EE" style="font:600 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">forward →</text><text x="1074.0" y="394.0" text-anchor="end" dominant-baseline="middle" fill="#F5B301" style="font:600 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">← backward</text><rect x="21.0" y="137.0" width="150.0" height="62.0" rx="8" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="1"/><text x="96.0" y="157.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="1">w</text><text x="96.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 15px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="1">1.5</text><text x="96.0" y="123.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="1">parameter</text><path d="M175.0,168.0 L254.0,168.0" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arw-web)" data-step="2"/><rect x="258.0" y="137.0" width="150.0" height="62.0" rx="8" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="2"/><text x="333.0" y="157.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="2">x1 = w·x</text><text x="333.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 15px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="2">3</text><text x="333.0" y="123.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="2">multiply</text><path d="M412.0,168.0 L491.0,168.0" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arw-web)" data-step="3"/><rect x="495.0" y="137.0" width="150.0" height="62.0" rx="8" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="3"/><text x="570.0" y="157.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="3">x2 = x1 + b</text><text x="570.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 15px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="3">1.8</text><text x="570.0" y="123.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="3">add</text><path d="M649.0,168.0 L728.0,168.0" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arw-web)" data-step="4"/><rect x="732.0" y="137.0" width="150.0" height="62.0" rx="8" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="4"/><text x="807.0" y="157.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="4">y = relu(x2)</text><text x="807.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 15px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="4">1.8</text><text x="807.0" y="123.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="4">relu</text><path d="M886.0,168.0 L965.0,168.0" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arw-web)" data-step="5"/><rect x="969.0" y="137.0" width="150.0" height="62.0" rx="8" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="5"/><text x="1044.0" y="157.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="5">loss = (y−t)²</text><text x="1044.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 15px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="5">1.69</text><text x="1044.0" y="123.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="5">squared error</text><path d="M965.0,336.0 L886.0,336.0" fill="none" stroke="#F5B301" stroke-width="1.6" marker-end="url(#arw-web)" data-step="6"/><rect x="841.5" y="320.0" width="168.0" height="32.0" rx="8" fill="rgba(245,179,1,0.15)" stroke="#F5B301" stroke-width="1.2" data-step="6"/><text x="925.5" y="336.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 11.5px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="6">∂loss/∂y = 2(y−t) = 2.6</text><text x="807.0" y="370.0" text-anchor="middle" dominant-baseline="middle" fill="#F5B301" style="font:400 12px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="6">∂loss/∂y = 2.6</text><path d="M728.0,336.0 L649.0,336.0" fill="none" stroke="#F5B301" stroke-width="1.6" marker-end="url(#arw-web)" data-step="7"/><rect x="604.5" y="320.0" width="168.0" height="32.0" rx="8" fill="rgba(245,179,1,0.15)" stroke="#F5B301" stroke-width="1.2" data-step="7"/><text x="688.5" y="336.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 11.5px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="7">∂y/∂x2 = 1</text><text x="570.0" y="370.0" text-anchor="middle" dominant-baseline="middle" fill="#F5B301" style="font:400 12px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="7">∂loss/∂x2 = 2.6</text><path d="M491.0,336.0 L412.0,336.0" fill="none" stroke="#F5B301" stroke-width="1.6" marker-end="url(#arw-web)" data-step="8"/><rect x="367.5" y="320.0" width="168.0" height="32.0" rx="8" fill="rgba(245,179,1,0.15)" stroke="#F5B301" stroke-width="1.2" data-step="8"/><text x="451.5" y="336.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 11.5px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="8">∂x2/∂x1 = 1</text><text x="333.0" y="370.0" text-anchor="middle" dominant-baseline="middle" fill="#F5B301" style="font:400 12px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="8">∂loss/∂x1 = 2.6</text><path d="M254.0,336.0 L175.0,336.0" fill="none" stroke="#F5B301" stroke-width="1.6" marker-end="url(#arw-web)" data-step="9"/><rect x="130.5" y="320.0" width="168.0" height="32.0" rx="8" fill="rgba(245,179,1,0.15)" stroke="#F5B301" stroke-width="1.2" data-step="9"/><text x="214.5" y="336.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 11.5px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="9">∂x1/∂w = x = 2</text><text x="96.0" y="370.0" text-anchor="middle" dominant-baseline="middle" fill="#F5B301" style="font:400 12px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="9">∂loss/∂w = 5.2</text><line x1="96.0" y1="203.0" x2="96.0" y2="310.0" stroke="rgba(160,205,255,0.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="333.0" y1="203.0" x2="333.0" y2="310.0" stroke="rgba(160,205,255,0.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="570.0" y1="203.0" x2="570.0" y2="310.0" stroke="rgba(160,205,255,0.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="807.0" y1="203.0" x2="807.0" y2="310.0" stroke="rgba(160,205,255,0.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="1044.0" y1="203.0" x2="1044.0" y2="310.0" stroke="rgba(160,205,255,0.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 5"/><text x="570.0" y="458.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 14.5px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" data-step="9">∂loss/∂w  =  2.6 × 1 × 1 × 2  =  5.2</text><text x="570.0" y="482.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:400 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="9">Multiply the local derivatives along the path. That is the chain rule, and applying it this way over a network is backpropagation.</text><text x="570.0" y="506.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="9">Each node only ever needs its OWN derivative — 2, 1, 1 — and what arrived from the right.</text></svg>