<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width:100%; background-color: transparent;" viewBox="0 0 347 1024" role="graphics-document document" aria-roledescription="flowchart-v2" preserveAspectRatio="xMidYMid meet"><style>#my-svg{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:#EAF2FF;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#1A2F52;}#my-svg .error-text{fill:#EAF2FF;stroke:#EAF2FF;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#5FC9DE;stroke:#5FC9DE;}#my-svg .marker.cross{stroke:#5FC9DE;}#my-svg svg{font-family:Inter,system-ui,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .label{font-family:Inter,system-ui,sans-serif;color:#EAF2FF;}#my-svg .cluster-label text{fill:#EAF2FF;}#my-svg .cluster-label span{color:#EAF2FF;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#EAF2FF;color:#EAF2FF;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#0E2A4E;stroke:#22D3EE;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#5FC9DE!important;stroke-width:0;stroke:#5FC9DE;}#my-svg .arrowheadPath{fill:rgba(255, 255, 255, 0);}#my-svg .edgePath .path{stroke:#5FC9DE;stroke-width:1px;}#my-svg .flowchart-link{stroke:#5FC9DE;fill:none;}#my-svg .edgeLabel{background-color:#04122B;text-align:center;}#my-svg .edgeLabel p{background-color:#04122B;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#04122B;fill:#04122B;}#my-svg .labelBkg{background-color:rgba(4, 18, 43, 0.5);}#my-svg .cluster rect{fill:rgba(255,255,255,0.04);stroke:#3C6795;stroke-width:1px;}#my-svg .cluster text{fill:#EAF2FF;}#my-svg .cluster span{color:#EAF2FF;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:100%;padding:2px;font-family:Inter,system-ui,sans-serif;font-size:12px;background:#1A2F52;border:1px solid #A78BFA;border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#EAF2FF;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#04122B;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#04122B;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#04122B;fill:#04122B;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#22D3EE;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shad