<svg class="dfig" viewBox="0 0 1220 414" preserveAspectRatio="xMidYMid meet" role="img" data-sim="4" data-sim-label="ring" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arw-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5FC9DE"/></marker></defs><style></style><rect x="60.0" y="56.0" width="1100.0" height="288.0" rx="16" fill="rgba(255,255,255,0.055)" stroke="#5FC9DE" stroke-width="1.3" data-step="1"/><text x="76.0" y="81.0" text-anchor="start" dominant-baseline="middle" fill="#5FC9DE" style="font:600 13.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="1">Artificial intelligence</text><text x="76.0" y="99.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="1">automating human cognitive work — a spreadsheet counts</text><rect x="179.6" y="108.0" width="860.9" height="220.0" rx="16" fill="rgba(255,255,255,0.10)" stroke="#8FA6C6" stroke-width="1.6" data-step="2"/><text x="195.6" y="133.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:600 13.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="2">Machine learning</text><text x="195.6" y="151.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="2">programs developed from exposure to data, not written by hand</text><rect x="299.1" y="160.0" width="621.7" height="152.0" rx="16" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6" data-step="3"/><text x="315.1" y="185.0" text-anchor="start" dominant-baseline="middle" fill="#22D3EE" style="font:600 13.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="3">Deep learning</text><text x="315.1" y="203.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="3">long chains of geometric transformations, structured as layers</text><rect x="418.7" y="212.0" width="382.6" height="84.0" rx="16" fill="rgba(245,179,1,0.15)" stroke="#F5B301" stroke-width="1.6" data-step="4"/><text x="610.0" y="248.0" text-anchor="middle" dominant-baseline="middle" fill="#F5B301" style="font:600 14.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="4">Generative AI</text><text x="610.0" y="390.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:400 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="4">Every ring is a strict subset of the one around it. A chain of four boxes says something else entirely.</text></svg>