idth="172.015625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Discard it</b><br />text as an unordered set<br /><small>bag-of-words models</small></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-2" data-look="classic" transform="translate(385.765625, 200)"><rect class="basic label-container" style="" x="-94.75" y="-47.75" width="189.5" height="95.5"/><g class="label" style="" transform="translate(-66.75, -33.75)"><rect/><foreignObject width="133.5" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Strictly sequential</b><br />one word at a time<br /><small>recurrent models</small></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-3" data-look="classic" transform="translate(648.609375, 200)"><rect class="basic label-container" style="" x="-113.09375" y="-59" width="226.1875" height="118"/><g class="label" style="" transform="translate(-85.09375, -45)"><rect/><foreignObject width="170.1875" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Hybrid</b><br />order-agnostic, but with<br />position injected<br /><small>the Transformer</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits