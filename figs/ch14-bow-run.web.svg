2FF" style="font:400 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">the</text><rect x="292.6" y="60.0" width="41.2" height="32.0" rx="6" fill="rgba(255,255,255,0.055)" stroke="rgba(160,205,255,0.22)" stroke-width="1.2"/><text x="313.2" y="76.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:400 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">mat</text><path d="M500.0,108.0 L500.0,146.0" fill="none" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#arw-web)"/><text x="514.0" y="128.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">count, and forget the order</text><text x="60.0" y="178.0" text-anchor="start" dominant-baseline="middle" fill="#8FA6C6" style="font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">The vector</text><rect x="60.0" y="196.0" width="96.0" height="40.0" rx="5" fill="rgba(255,255,255,0.055)" stroke="rgba(160,205,255,0.22)" stroke-width="1"/><text x="108.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:600 16px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">1</text><text x="108.0" y="252.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">cat</text><rect x="162.0" y="196.0" width="96.0" height="40.0" rx="5" fill="rgba(255,255,255,0.055)" stroke="rgba(160,205,255,0.22)" stroke-width="1"/><text x="210.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:600 16px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">1</text><text x="210.0" y="252.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">mat</text><rect x="264.0" y="196.0" width="96.0" height="40.0" rx="5" fill="rgba(255,255,255,0.055)" stroke="rgba(160,205,255,0.22)" stroke-width="1"/><text x="312.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:600 16px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">1</text><text x="312.0" y="252.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">on</text><rect x="366.0" y="196.0" width="96.0" height="40.0" rx="5" fill="rgba(255,255,255,0.055)" stroke="rgba(160,205,255,0.22)" stroke-width="1"/><text x="414.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#EAF2FF" style="font:600 16px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">1</text><text x="414.0" y="252.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">sat</text><rect x="468.0" y="196.0" width="96.0" height="40.0" rx="5" fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.6"/><text x="516.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#22D3EE" style="font:600 16px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">2</text><text x="516.0" y="252.0" text-anchor="middle" dominant-baseline="middle" fill="#8FA6C6" style="font:400 11.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">the</text><text x="60.0" y="324.0" text-anchor="start" dominant-baseline="middle" fill="#B6C9E4" style="font:400 13px ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">shape (5,) — one slot per vocabulary word, and this vocabulary has 5.</text><text x="60.0" y="352.0" text-anchor="start" dominant-baseline="middle" fill="#B6C9E4" style="font:400 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">Reverse it and you cannot: cat×1 mat×1 on×1 sat×1 the×2 … has no order left in it.</text><text x="60.0" y="378.0" text-anchor="start" dominant-baseline="middle" fill="#F5B301" style="font:400 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">“the cat sat on the mat” and “the mat sat on the cat” give the identical vector. That is the whole limitation, in one line.</text></svg>