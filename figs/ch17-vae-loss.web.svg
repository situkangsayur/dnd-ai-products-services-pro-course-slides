svg-flowchart-T-0" data-look="classic" transform="translate(286.28125, 33.25)"><rect class="basic label-container" style="" x="-95.9453125" y="-25.25" width="191.890625" height="50.5"/><g class="label" style="" transform="translate(-67.9453125, -11.25)"><rect/><foreignObject width="135.890625" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Two losses, added</b></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-1" data-look="classic" transform="translate(132.7890625, 188.75)"><rect class="basic label-container" style="" x="-124.7890625" y="-59" width="249.578125" height="118"/><g class="label" style="" transform="translate(-96.7890625, -45)"><rect/><foreignObject width="193.578125" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Reconstruction loss</b><br /><small>binary crossentropy</small><br />forces the decoded sample<br />to match the input</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-K-2" data-look="classic" transform="translate(439.7734375, 188.75)"><rect class="basic label-container" style="" x="-127.1953125" y="-70.25" width="254.390625" height="140.5"/><g class="label" style="" transform="translate(-99.1953125, -56.25)"><rect/><foreignObject width="198.390625" height="112.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>Regularization loss</b><br /><small>Kullback-Leibler divergence</small><br />nudges the encoder output<br />toward a normal distribution<br />centred on zero</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-E-3" data-look="classic" transform="translate(286.28125, 366.75)"><rect class="basic label-container" style="" x="-128" y="-47.75" width="256" height="95.5"/><g class="label" style="" transform="translate(-100, -33.75)"><rect/><foreignObject width="200" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width:100%; text-align: center; width: 200px;"><span class="nodeLabel"><p>A latent space that is<br /><b>continuous and well-rounded</b></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/><stop offset="100%" stop-color="#2C7BD4" stop-opacity="1"/></linearGradient></svg>