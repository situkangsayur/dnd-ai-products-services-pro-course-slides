Object width="200" height="112.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width:100%; text-align: center; width: 200px;"><span class="nodeLabel"><p>An unintelligent solution to a<br />specific task is always easier<br />than solving intelligence</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T-4" data-look="classic" transform="translate(1269.75, 78.25)"><rect class="basic label-container" style="" x="-125.140625" y="-36.5" width="250.28125" height="73"/><g class="label" style="" transform="translate(-97.140625, -22.5)"><rect/><foreignObject width="194.28125" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width:100%; text-align: center;"><span class="nodeLabel"><p><b>So that is the shortcut<br />you take, 100% of the time</b></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/><stop offset="100%" stop-color="#2C7BD4" stop-opacity="1"/></linearGradient></svg>