hor="start" dominant-baseline="middle" fill="#FB7185" style="font:400 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="1">Potongan ukuran tetap memotong fakta di tengah: “kategori B” ada di potongan kiri, “Rp 500 juta” di kanan.</text><text x="62.0" y="412.0" text-anchor="start" dominant-baseline="middle" fill="#22D3EE" style="font:600 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" data-step="3">Tak satu pun potongan bisa menjawab pertanyaan tentang batas kategori B — dan tidak ada yang melaporkan kegagalan itu.</text></svg>